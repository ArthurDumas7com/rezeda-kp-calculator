        const termText = first
          ? daysNom(s.days) + (adv > 0
              ? " с даты внесения аванса за этап и передачи исходных данных, указанных в таблице выше (в зависимости от того, что произойдет позднее)."
              : " с даты передачи исходных данных, указанных в таблице выше.")
          : daysNom(s.days) + (adv > 0
              ? " с даты приема-передачи результатов предыдущего этапа и внесения аванса за данный этап (в зависимости от того, что произойдет позднее)."
              : " с даты приема-передачи результатов предыдущего этапа работ.");

        B.push({ k: "p", t: "Этап №" + n + ". " + (s.name || "____________________"), cls: "db dat" });
        B.push({ k: "p", t: n + ".1. Результаты работ по этапу:" });
        (s.results.length ? s.results : ["________________"]).forEach((r) =>
          B.push({ k: "p", t: "● " + r, cls: "di" }));
        B.push({
          k: "p",
          t: n + ".2. При согласовании результатов работ по данному этапу допустимо внесение незначительных поправок по запросу Заказчика в количестве: не более " +
            s.edits + " раз (блоков)." + (first ? " Здесь и далее – поправки вносятся в порядке, указанном в статье 4 Договора." : ""),
        });
        B.push({ k: "p", t: n + ".3. Сроки и цена работ по данному этапу:" });
        B.push({
          k: "tbl", widths: [8, 22, 70], keep: true,
          rows: [
            [{ b: [{ k: "p", t: n + ".3.1." }] }, { b: [{ k: "p", t: "Цена:" }] }, { b: [{ k: "p", t: cash(s.price, m.nds) }] }],
            [{ b: [{ k: "p", t: n + ".3.2." }] }, { b: [{ k: "p", t: "Порядок оплаты:" }] }, { b: pay.map((t) => ({ k: "p", t })) }],
            [{ b: [{ k: "p", t: n + ".3.3." }] }, { b: [{ k: "p", t: "Срок работ по этапу:" }] }, { b: [{ k: "p", t: termText }] }],
          ],
        });
      });

      B.push({ k: "at", t: "Прочие условия" });
      P("1. Настоящий Состав работ составлен в двух подлинных экземплярах, по одному для каждой Стороны.");
      P("2. Настоящий Состав работ является приложением и неотъемлемой частью заключенного Договора.");
      B.push({ k: "sp" });
      B.push({ k: "p", t: "Подписи Сторон:", cls: "db" });
      const shortSign = (p, role) => ({
        b: [{ k: "p", t: (role === "exec" ? "Исполнитель:" : "Заказчик:"), cls: "db" }]
          .concat(signLines(p, role).map((l) => ({ k: "p", t: l }))),
      });
      B.push({ k: "tbl", widths: [50, 50], keep: true, rows: [[shortSign(f.exec, "exec"), shortSign(f.client, "client")]] });

      /* ---------- ПРИЛОЖЕНИЕ №2: НДС ---------- */
      if (f.app2) {
        B.push({ k: "br" });
        B.push({ k: "p", t: "Приложение № 2 к Договору №" + num + (f.date ? " от " + dmy(f.date) + " г." : ""), cls: "dc db" });
        B.push({ k: "sp" });
        APP2.forEach((x) => {
          if (x.h) P(x.h);
          else if (x.n) B.push({ k: "p", t: x.n, cls: "db dat" });
          else P("• " + x.b, "di");
        });
        B.push({ k: "sp" });
        B.push({ k: "p", t: "Подписи Сторон", cls: "db" });
        B.push({ k: "tbl", widths: [50, 50], keep: true, rows: [[shortSign(f.exec, "exec"), shortSign(f.client, "client")]] });
      }

      return B;
    }

    /* =========================================================================
       ДОГОВОР — 3/3: рендер (HTML + .docx), интерфейс, вкладки
       ========================================================================= */

    /* ── Вывод дерева в HTML (предпросмотр = печатный макет) ──────────────── */
    function DocBlock({ b }) {
      if (b.k === "sp") return <p>&nbsp;</p>;
      if (b.k === "h") return <p className="dc db">{b.t}</p>;
      if (b.k === "at") return <p className="db dat">{b.t}</p>;
      if (b.k === "p") return <p className={b.cls || ""}>{b.t}</p>;
      if (b.k === "tbl") {
        return (
          <table className={"dt" + (b.keep ? " keep" : "")}>
            <tbody>
              {b.rows.map((r, ri) => (
                <tr key={ri}>
                  {r.map((c, ci) => (
                    <td key={ci} style={{ width: (b.widths[ci] || Math.floor(100 / r.length)) + "%" }}>
                      {typeof c === "string"
                        ? <p>{c}</p>
                        : c.b.map((x, i) => <DocBlock key={i} b={x} />)}
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        );
      }
      return null;
    }

    // Документ делится на части по разрывам страниц ({k:'br'}): договор,
    // Приложение №1, Приложение №2. Каждая часть — своя таблица .doc-frame,
    // её thead/tfoot браузер повторяет на каждой странице PDF (колонтитулы).
    function DocSheet({ blocks }) {
      const parts = [[]];
      blocks.forEach((b) => {
        if (b.k === "br") parts.push([]);
        else parts[parts.length - 1].push(b);
      });
      return (
        <div className="doc doc-sheet">
          {parts.map((part, i) => (
            <table
              key={i}
              className={"doc-frame" + (i ? " doc-next" : "")}
              style={i ? { breakBefore: "page", pageBreakBefore: "always" } : null}
            >
              <thead>
                <tr><td className="doc-hpad">
                  <div style={{ textAlign: "right" }}>
                    <img src={DOC_LOGO_URI} alt="rezeda" style={{ width: "29mm", height: "auto", display: "inline-block" }} />
                  </div>
                </td></tr>
              </thead>
              <tfoot>
                <tr><td className="doc-fpad"><div className="doc-foot">{DOC_FOOTER_TEXT}</div></td></tr>
              </tfoot>
              <tbody>
                <tr><td>{part.map((b, j) => <DocBlock key={j} b={b} />)}</td></tr>
              </tbody>
            </table>
          ))}
        </div>
      );
    }

    /* ── Вывод дерева в .docx ─────────────────────────────────────────────── */
    const DOCX_URL = "https://unpkg.com/docx@9.7.1/dist/index.umd.cjs";
    let docxLoading = null;
    const loadDocx = () => {
      if (window.docx) return Promise.resolve(window.docx);
      if (!docxLoading) {
        docxLoading = new Promise((res, rej) => {
          const s = document.createElement("script");
          s.src = DOCX_URL;
          s.onload = () => (window.docx ? res(window.docx) : rej(new Error("библиотека docx не инициализировалась")));
          s.onerror = () => { docxLoading = null; rej(new Error("нет доступа к CDN (unpkg.com)")); };
          document.head.appendChild(s);
        });
      }
      return docxLoading;
    };
    const b64bytes = (b64) => {
      const bin = atob(b64);
      const u = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      return u;
    };
    const dlBlob = (blob, name) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    };

    function docxBlocks(blocks, D) {
      const AL = D.AlignmentType;
      const nb = () => ({ style: D.BorderStyle.NONE, size: 0, color: "FFFFFF" });
      const noBorders = { top: nb(), bottom: nb(), left: nb(), right: nb(), insideHorizontal: nb(), insideVertical: nb() };
      const para = (b) => {
        if (b.k === "sp") return new D.Paragraph({ children: [new D.TextRun({ text: "" })] });
        const cls = b.cls || "";
        const bold = b.k === "h" || b.k === "at" || cls.indexOf("db") >= 0;
        const align = (b.k === "h" || cls.indexOf("dc") >= 0) ? AL.CENTER
          : cls.indexOf("dr") >= 0 ? AL.RIGHT : AL.JUSTIFIED;
        const indent = cls.indexOf("di2") >= 0 ? { left: 680 }
          : cls.indexOf("di") >= 0 ? { left: 397 } : undefined;
        return new D.Paragraph({
          alignment: align,
          indent: indent,
          spacing: { before: (b.k === "at" || cls.indexOf("dat") >= 0) ? 140 : 0, after: 50, line: 262 },
          children: [new D.TextRun({ text: b.t || "", bold: bold })],
        });
      };
      const out = [];
      blocks.forEach((b) => {
        if (b.k === "br") { out.push(new D.Paragraph({ children: [new D.PageBreak()] })); return; }
        if (b.k === "tbl") {
          out.push(new D.Table({
            width: { size: 100, type: D.WidthType.PERCENTAGE },
            borders: noBorders,
            rows: b.rows.map((r) => new D.TableRow({
              cantSplit: !!b.keep,
              children: r.map((c, ci) => new D.TableCell({
                width: { size: b.widths[ci] || Math.floor(100 / r.length), type: D.WidthType.PERCENTAGE },
                margins: { top: 20, bottom: 20, left: 0, right: 110 },
                children: (typeof c === "string" ? [{ k: "p", t: c }] : c.b).map(para),
              })),
            })),
          }));
          // после таблицы — пустой абзац, иначе Word склеивает таблицы
          out.push(new D.Paragraph({ children: [new D.TextRun({ text: "" })], spacing: { after: 0 } }));
          return;
        }
        out.push(para(b));
      });
      return out;
    }

    function docFileName(m) {
      const who = m.f.client.name ? " " + m.f.client.name.split(/\s+/)[0] : "";
      return ("Договор " + (m.f.num || "б-н") + who).replace(/[\\/:*?"<>|]/g, "-");
    }

    function exportDocx(m) {
      return loadDocx().then((D) => {
        const doc = new D.Document({
          creator: "REZEDA",
          title: docFileName(m),
          styles: {
            default: {
              document: {
                run: { font: "Inter", size: 18, color: "000000" },
                paragraph: { spacing: { after: 50, line: 262 }, alignment: D.AlignmentType.JUSTIFIED },
              },
            },
          },
          sections: [{
            properties: {
              page: {
                size: { width: 11900, height: 16840 },
                margin: { top: 1021, right: 851, bottom: 1021, left: 1134, header: 709, footer: 567 },
              },
            },
            headers: {
              default: new D.Header({
                children: [new D.Paragraph({
                  alignment: D.AlignmentType.RIGHT,
                  spacing: { after: 0 },
                  children: [new D.ImageRun({
                    type: "png",
                    data: b64bytes(DOC_LOGO_B64),
                    transformation: { width: 110, height: 16 },
                  })],
                })],
              }),
            },
            footers: {
              default: new D.Footer({
                children: [new D.Paragraph({
                  alignment: D.AlignmentType.CENTER,
                  children: [new D.TextRun({ text: DOC_FOOTER_TEXT })],
                })],
              }),
            },
            children: docxBlocks(docTree(m), D),
          }],
        });
        return D.Packer.toBlob(doc);
      }).then((blob) => dlBlob(blob, docFileName(m) + ".docx"));
    }

    /* ── Локальное хранение (единственное место с localStorage в проекте) ─── */
    const LS_KEY = "rezeda.dogovor.v1";
    // В некоторых окружениях (приватный режим, sandbox, data:-URL) хранилище
    // отключено — тогда работают только кнопки «Экспорт / Импорт».
    const STORAGE_OK = (() => {
      try { localStorage.setItem(LS_KEY + ".test", "1"); localStorage.removeItem(LS_KEY + ".test"); return true; }
      catch (e) { return false; }
    })();
    const lsLoad = () => {
      try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; }
    };
    const lsSave = (data) => {
      try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (e) { /* приватный режим / переполнение */ }
    };
    const mergeForm = (saved) => {
      const f = Object.assign(initialDocForm(), saved || {});
      f.exec = Object.assign(emptyExec(), (saved && saved.exec) || {});
      f.client = Object.assign(emptyClient(), (saved && saved.client) || {});
      const st = (saved && saved.stages && saved.stages.length) ? saved.stages : initialDocForm().stages;
      f.stages = st.map((s, i) => Object.assign(emptyStage(f.disc, i), s));
      return f;
    };

    /* ── Сервер данных на этом компьютере ─────────────────────────────────
       Хранилище справочников — этот ПК (server/rezeda-server.js). Сайт при
       этом остаётся автономным: если сервер не отвечает, работаем на
       localStorage, а изменения уходят на сервер при следующей связи.
       ──────────────────────────────────────────────────────────────────── */
    const SRV_KEY = "rezeda.dogovor.server";
    const SRV_DEFAULT = "http://localhost:8765";
    // страница открыта с самого сервера → адрес известен, спрашивать нечего
    const SRV_SELF = location.protocol === "http:" || location.protocol === "https:";
    const srvLoadUrl = () => {
      try { return localStorage.getItem(SRV_KEY) || SRV_DEFAULT; } catch (e) { return SRV_DEFAULT; }
    };
    const srvSaveUrl = (u) => { try { localStorage.setItem(SRV_KEY, u); } catch (e) {} };
    const srvBase = (u) => (SRV_SELF ? location.origin : String(u || "").trim().replace(/\/+$/, ""));

    const srvFetch = (base, path, opt) => {
      if (!base) return Promise.reject(new Error("не указан адрес сервера"));
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 4000);
      return fetch(base + path, Object.assign({ signal: ctl.signal, cache: "no-store" }, opt || {}))
        .then((r) => { if (!r.ok) throw new Error("сервер ответил " + r.status); return r.json(); })
        .finally(() => clearTimeout(timer));
    };
    // браузерные тексты ошибок в интерфейсе не показываем
    const srvErr = (e) => (e && (e.name === "AbortError" || /Failed to fetch|NetworkError|ERR_/i.test(e.message || "")))
      ? "нет связи" : ((e && e.message) || "ошибка");
    const srvGet = (base) => srvFetch(base, "/api/data");
    const srvPut = (base, execs, clients) => srvFetch(base, "/api/data", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ execs, clients }),
    });

    // Слияние справочников: побеждает запись с более поздним updatedAt.
    // Удаления переживают синхронизацию как «надгробия» (deleted: true) —
    // иначе удалённый профиль вернулся бы с устройства, которое его помнит.
    const mergeDir = (a, b) => {
      const map = new Map();
      (a || []).concat(b || []).forEach((x) => {
        if (!x || !x.id) return;
        const cur = map.get(x.id);
        if (!cur || (x.updatedAt || 0) >= (cur.updatedAt || 0)) map.set(x.id, x);
      });
      return Array.from(map.values());
    };
    const alive = (list) => (list || []).filter((x) => x && !x.deleted);

    /* ── Мелкие элементы формы ────────────────────────────────────────────── */
    const F_IN = "mt-1 w-full hair bg-air px-3 py-2 text-sm font-normal outline-none focus:border-grape";
    const F_LB = "text-[11px] font-medium uppercase tracking-[0.18em] text-black/40";

    function Fld({ label, value, onChange, ph, type, area, rows, hint }) {
      return (
        <label className="block min-w-0">
          <span className={F_LB}>{label}</span>
          {area
            ? <textarea rows={rows || 3} value={value || ""} placeholder={ph}
                onChange={(e) => onChange(e.target.value)} className={F_IN + " resize-y leading-relaxed"} />
            : <input type={type || "text"} value={value == null ? "" : value} placeholder={ph}
                onChange={(e) => onChange(e.target.value)} className={F_IN} />}
          {hint ? <span className="mt-1 block text-[11px] font-light text-black/40">{hint}</span> : null}
        </label>
      );
    }

    function Seg({ options, value, onChange }) {
      return (
        <div className="inline-flex hair">

            <button key={k} onClick={() => onChange(k)}
              className={"px-4 py-2 text-sm transition " +

              {l}
            </button>
          ))}
        </div>

    function Chk({ label, checked, onChange, note }) {

            <span className="block text-sm font-normal">{label}</span>
            {note ? <span className="block text-[11px] font-light text-black/40">{note}</span> : null}
          </span>
        </label>

    function DocSection({ title, note, open, onToggle, children }) {

          <button onClick={onToggle} className="w-full flex items-center justify-between gap-4 px-5 py-4 text-left">

                    onChange={(v) => upd({ viaMc: v })}
                    note="«в лице генерального директора управляющей компании ООО «…» ФИО»" />

            <Fld label="Подпись (в скобках)" value={p.signerShort} onChange={(v) => upd({ signerShort: v })}
              ph="Д.С. Галин" hint="если пусто — соберётся из ФИО" />
          )}

          {isExec ? (
            <div className="pt-2 border-t border-concrete">
              <span className={F_LB}>Налоговый режим</span>
              <div className="mt-2 flex flex-wrap gap-2">
                {TAX_MODES.map(([k, l]) => (
                  <button key={k} onClick={() => upd({ tax: k })}
                    className={"px-3 py-2 text-xs hair transition " +
                      (p.tax === k ? "bg-night text-air border-night" : "bg-air text-black/55 hover:bg-steel")}>
                    {l}
                  </button>
                ))}
              </div>
              <p className="mt-2 text-[11px] font-light text-black/40">
                НДС 5% выделяется автоматически (5/105) в общей цене и в каждом платеже.
              </p>
            </div>
          ) : null}
        </div>
      );
    }

    /* ── Справочник профилей ──────────────────────────────────────────────── */
    function ProfileBar({ list, current, onPick, onSave, onDelete, label }) {
      return (
        <div className="flex flex-wrap items-end gap-2 pb-4 border-b border-concrete">
          <label className="min-w-0 flex-1">
            <span className={F_LB}>{label}</span>
            <select value=""
              onChange={(e) => { if (e.target.value) onPick(e.target.value); }}
              className={F_IN}>
              <option value="">— выбрать сохранённый —</option>
              {list.map((x) => <option key={x.id} value={x.id}>{x.profile || x.name || "без имени"}</option>)}
            </select>
          </label>
          <button onClick={onSave} className="hair bg-sun px-4 py-2 text-xs font-medium uppercase tracking-[0.12em] hover:brightness-95">
            Сохранить
          </button>
          <button onClick={onDelete} disabled={!list.some((x) => x.id === current.id)}
            className="hair bg-air px-4 py-2 text-xs uppercase tracking-[0.12em] text-black/50 hover:bg-steel disabled:opacity-40">
            Удалить
          </button>
        </div>
      );
    }

    /* ── Этапы ────────────────────────────────────────────────────────────── */
    function StageRow({ s, i, total, advance, onChange, onDrop, onMove }) {
      return (
        <div className="hair bg-steel p-4 space-y-3">
          <div className="flex items-center justify-between gap-3">
            <span className="text-[11px] font-medium uppercase tracking-[0.18em] text-black/40">Этап №{i + 1}</span>
            <div className="flex items-center gap-1">
              <button onClick={() => onMove(-1)} disabled={i === 0}
                className="hair bg-air px-2 py-1 text-xs disabled:opacity-30">↑</button>
              <button onClick={() => onMove(1)} disabled={i === total - 1}
                className="hair bg-air px-2 py-1 text-xs disabled:opacity-30">↓</button>
              <button onClick={onDrop} className="hair bg-air px-2 py-1 text-xs text-black/50 hover:bg-air">Удалить</button>
            </div>
          </div>
          <Fld label="Название этапа" value={s.name} onChange={(v) => onChange({ name: v })}
            ph="Эскизный проект" />
          <Fld label="Результаты работ по этапу" area rows={4} value={s.results}
            onChange={(v) => onChange({ results: v })}
            ph={"Каждая строка — отдельный пункт списка"} />
          <div className="grid sm:grid-cols-4 gap-3">
            <Fld label="Цена, ₽" type="number" value={s.price} onChange={(v) => onChange({ price: v })} />
            <Fld label="Срок, раб. дн." type="number" value={s.days} onChange={(v) => onChange({ days: v })} />
            <Fld label="Блоков правок" type="number" value={s.edits} onChange={(v) => onChange({ edits: v })} />
            <Fld label="Аванс, %" type="number"
              value={s.advance == null ? "" : s.advance}
              ph={String(advance)}
              onChange={(v) => onChange({ advance: v === "" ? null : Number(v) })}
              hint="пусто = общий" />
          </div>
        </div>
      );
    }

    /* ── Основной инструмент ──────────────────────────────────────────────── */
    function ContractTool({ kpSnap }) {
      const saved = useRef(lsLoad()).current;
      const [form, setForm] = useState(() => (saved.form ? mergeForm(saved.form) : initialDocForm()));
      const [execs, setExecs] = useState(() => (saved.execs && saved.execs.length ? saved.execs : PRESET_EXECS));
      const [clients, setClients] = useState(() => (saved.clients && saved.clients.length ? saved.clients : PRESET_CLIENTS));
      const [open, setOpen] = useState({ main: true, exec: false, client: false, obj: false, stages: true, extra: false });
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState("");
      const fileRef = useRef(null);
      // адрес сервера данных: когда страница открыта с него самого — известен
      const [srvUrl, setSrvUrl] = useState(srvLoadUrl);
      const [sync, setSync] = useState({ state: "idle" });
      const base = srvBase(srvUrl);

      const toggle = (k) => setOpen((p) => Object.assign({}, p, { [k]: !p[k] }));

      // Автосохранение справочников и черновика (с задержкой, чтобы не писать на каждую букву)
      useEffect(() => {
        const t = setTimeout(() => lsSave({ form, execs, clients }), 400);
        return () => clearTimeout(t);
      }, [form, execs, clients]);

      // Получить справочники с сервера (quiet — молча, при открытии вкладки)
      const pull = (quiet) => {
        if (!base) { setSync({ state: "off", msg: "адрес не указан" }); return; }
        setSync({ state: "busy" });
        srvGet(base).then((d) => {
          setExecs((l) => mergeDir(l, d.execs));
          setClients((l) => mergeDir(l, d.clients));
          setSync({ state: "ok", at: Date.now() });
          if (!quiet) setMsg("Справочники получены с сервера данных");
        }).catch((e) => {
          setSync({ state: "off", msg: srvErr(e) });
          if (!quiet) setMsg("Сервер данных недоступен (" + srvErr(e) + ") — работаем с локальной копией.");
        });
      };
      // Отправить справочники на сервер. Сервер сливает их со своими и
      // возвращает результат — так изменения с разных устройств не затирают друг друга.
      const pushDirs = (ex, cl, loud) => {
        if (!base) {
          setSync({ state: "off", msg: "адрес не указан" });
          if (loud) setMsg("Не указан адрес сервера данных.");
          return;
        }
        setSync({ state: "busy" });
        srvPut(base, ex, cl).then((d) => {
          setExecs((l) => mergeDir(l, d.execs));
          setClients((l) => mergeDir(l, d.clients));
          setSync({ state: "ok", at: Date.now() });
          if (loud) setMsg("Справочники синхронизированы с сервером данных");
        }).catch((e) => {
          setSync({ state: "pending", msg: srvErr(e) });
          if (loud) setMsg("Сервер данных не ответил (" + srvErr(e) + ") — изменения остались на этом устройстве.");
        });
      };
      useEffect(() => { pull(true); }, []);

      const upd = (patch) => setForm((p) => Object.assign({}, p, patch));
      const updExec = (patch) => setForm((p) => Object.assign({}, p, { exec: Object.assign({}, p.exec, patch) }));
      const updClient = (patch) => setForm((p) => Object.assign({}, p, { client: Object.assign({}, p.client, patch) }));
      const updStage = (id, patch) => setForm((p) => Object.assign({}, p, {
        stages: p.stages.map((s) => (s.id === id ? Object.assign({}, s, patch) : s)),
      }));

      const setDisc = (v) => setForm((p) => {
        const patch = { disc: v };
        // дефолтные исходные данные подменяем только если их не правили руками
        if (!p.sources || p.sources === DOC_DISC[p.disc].sources) patch.sources = DOC_DISC[v].sources;
        return Object.assign({}, p, patch);
      });

      const addStage = () => setForm((p) => Object.assign({}, p, {
        stages: p.stages.concat([emptyStage(p.disc, p.stages.length)]),
      }));
      const dropStage = (id) => setForm((p) => Object.assign({}, p, {
        stages: p.stages.length > 1 ? p.stages.filter((s) => s.id !== id) : p.stages,
      }));
      const moveStage = (i, dir) => setForm((p) => {
        const j = i + dir;
        if (j < 0 || j >= p.stages.length) return p;
        const st = p.stages.slice();
        const t = st[i]; st[i] = st[j]; st[j] = t;
        return Object.assign({}, p, { stages: st });
      });

      // Перенос из калькулятора КП
      const importKp = () => {
        const snap = kpSnap && kpSnap.current;
        if (!snap || !snap.items.length) {
          setMsg("В калькуляторе КП не выбрано ни одного этапа — включите нужные разделы на вкладке «Коммерческое предложение».");
          return;
        }
        const mine = snap.items.filter((it) => it.disc === form.disc);
        const items = mine.length ? mine : snap.items;
        const stages = items.map((it, i) => Object.assign(emptyStage(form.disc, i), {
          name: it.label,
          results: it.desc || "",
          price: String(Math.round(it.cost)),
          days: String(it.days || ""),
        }));
        const a = snap.area[form.disc];
        upd({
          stages,
          area: a ? String(a) : form.area,
          subtitle: form.subtitle || snap.title || "",
        });
        setMsg("Перенесено этапов: " + stages.length + (mine.length ? "" : " (из всех дисциплин КП)"));
      };

      // Профили
      const pickExec = (id) => {
        const x = execs.find((e) => e.id === id);
        if (x) upd({ exec: Object.assign(emptyExec(), x) });
      };
      const saveExec = () => {
        const p = Object.assign({}, form.exec, { updatedAt: Date.now(), deleted: false });
        if (!p.profile || p.profile === "Новый профиль") p.profile = p.name || "Профиль";
        const next = execs.some((e) => e.id === p.id) ? execs.map((e) => (e.id === p.id ? p : e)) : execs.concat([p]);
        setExecs(next);
        upd({ exec: p });
        pushDirs(next, clients);
        setMsg("Профиль Исполнителя сохранён");
      };
      const delExec = () => {
        const next = execs.map((e) => (e.id === form.exec.id ? Object.assign({}, e, { deleted: true, updatedAt: Date.now() }) : e));
        setExecs(next);
        pushDirs(next, clients);
        setMsg("Профиль Исполнителя удалён");
      };
      const pickClient = (id) => {
        const x = clients.find((e) => e.id === id);
        if (x) upd({ client: Object.assign(emptyClient(), x) });
      };
      const saveClient = () => {
        const p = Object.assign({}, form.client, { updatedAt: Date.now(), deleted: false });
        if (!p.profile || p.profile === "Новый заказчик") p.profile = p.name || "Заказчик";
        const next = clients.some((e) => e.id === p.id) ? clients.map((e) => (e.id === p.id ? p : e)) : clients.concat([p]);
        setClients(next);
        upd({ client: p });
        pushDirs(execs, next);
        setMsg("Заказчик сохранён");
      };
      const delClient = () => {
        const next = clients.map((e) => (e.id === form.client.id ? Object.assign({}, e, { deleted: true, updatedAt: Date.now() }) : e));
        setClients(next);
        pushDirs(execs, next);
        setMsg("Заказчик удалён из справочника");
      };

      // Резервная копия
      const exportJson = () => {
        dlBlob(new Blob([JSON.stringify({ form, execs, clients }, null, 2)], { type: "application/json" }),
          "rezeda-dogovor-dannye.json");
      };
      const importJson = (file) => {
        const r = new FileReader();
        r.onload = () => {
          try {
            const d = JSON.parse(r.result);
            if (d.execs) setExecs((l) => mergeDir(l, d.execs));
            if (d.clients) setClients((l) => mergeDir(l, d.clients));
            if (d.form) setForm(mergeForm(d.form));
            setMsg("Данные из файла добавлены к справочникам");
          } catch (e) { setMsg("Не удалось прочитать файл: " + e.message); }
        };
        r.readAsText(file);
      };

      const m = useMemo(() => docModel(form), [form]);
      const blocks = useMemo(() => docTree(m), [m]);

      const problems = [];
      if (!form.num) problems.push("не указан номер договора");
      if (!form.client.name) problems.push("не заполнен Заказчик");
      if (!form.objAddr) problems.push("не указан адрес Объекта");
      if (!m.stages.length) problems.push("нет этапов");
      if (m.stages.some((s) => !s.price)) problems.push("есть этапы без цены");
      if (m.stages.some((s) => !s.days)) problems.push("есть этапы без срока");
      if (m.stages.some((s) => !s.name)) problems.push("есть этапы без названия");

      const SYNC_DOT = { ok: "bg-grape", busy: "bg-sun", pending: "bg-dawn", off: "bg-concrete", idle: "bg-concrete" };
      const syncText =
        sync.state === "ok" ? "Сервер данных на связи · исполнителей " + alive(execs).length + ", заказчиков " + alive(clients).length
        : sync.state === "busy" ? "Обмен с сервером данных…"
        : sync.state === "idle" ? "Проверяем сервер данных…"
        : sync.state === "pending" ? "Сохранено локально: сервер не ответил. Нажмите «Синхронизировать», когда он будет включён."
        : "Сервер данных недоступен — справочники берутся из этого браузера" + (sync.msg ? " (" + sync.msg + ")" : "");

      const doWord = () => {
        setBusy(true); setMsg("Готовим .docx…");
        exportDocx(m)
          .then(() => setMsg("Файл Word сохранён"))
          .catch((e) => setMsg("Word не сформирован: " + e.message))
          .then(() => setBusy(false));
      };

      return (
        <div className="min-h-screen">
          <div className="screen-only">
            <header className="border-b border-concrete bg-air">
              <div className="max-w-6xl mx-auto px-6 py-6 flex flex-col items-start gap-2">
                <img src="LOGO.png" alt="rezeda" onError={(e) => { e.currentTarget.style.display = "none"; }}
                  style={{ filter: "brightness(0)" }} className="h-8 sm:h-10 w-auto object-contain object-left" />
                <span className="text-xs font-medium uppercase tracking-[0.22em] text-black/50">Договор</span>
              </div>
            </header>

            <main className="max-w-6xl mx-auto w-full px-6 pt-8 pb-10">
              <div className="grid lg:grid-cols-[1fr_360px] gap-8 items-start">
                <div className="space-y-4 min-w-0">

                  <DocSection title="Договор" note="формат, номер, дата" open={open.main} onToggle={() => toggle("main")}>
                    <div className="flex flex-wrap items-center gap-3">
                      <span className={F_LB}>Формат</span>
                      <Seg options={[["arch", "Архитектура"], ["int", "Интерьер / дизайн-проект"]]}
                        value={form.disc} onChange={setDisc} />
                    </div>
                    <div className="grid sm:grid-cols-3 gap-4">
                      <Fld label="Номер договора" value={form.num} onChange={(v) => upd({ num: v })}
                        ph={"8_" + String(yearOf(form.date)).slice(2)} />
                      <Fld label="Дата" type="date" value={form.date} onChange={(v) => upd({ date: v })} />
                      <Fld label="Город" value={form.city} onChange={(v) => upd({ city: v })} />
                    </div>
                    <Fld label="Подзаголовок (необязательно)" value={form.subtitle} onChange={(v) => upd({ subtitle: v })}
                      ph="рабочая документация проекта освещения ТЦ «Ликон-2»"
                      hint="выводится в скобках под названием договора" />
                  </DocSection>

                  <DocSection title="Исполнитель" note={form.exec.name || "наша сторона"} open={open.exec} onToggle={() => toggle("exec")}>
                    <ProfileBar label="Профиль исполнителя" list={alive(execs)} current={form.exec}
                      onPick={pickExec} onSave={saveExec} onDelete={delExec} />
                    <PartyForm role="exec" p={form.exec} upd={updExec} />
                  </DocSection>

                  <DocSection title="Заказчик" note={form.client.name || "контрагент"} open={open.client} onToggle={() => toggle("client")}>
                    <ProfileBar label="Сохранённые заказчики" list={alive(clients)} current={form.client}
                      onPick={pickClient} onSave={saveClient} onDelete={delClient} />
                    <PartyForm role="client" p={form.client} upd={updClient} />
                  </DocSection>

                  <DocSection title="Объект" note="адрес, площадь, исходные данные" open={open.obj} onToggle={() => toggle("obj")}>
                    <Fld label={DOC_DISC[form.disc].addrLabel.replace(":", "")} value={form.objAddr}
                      onChange={(v) => upd({ objAddr: v })} />
                    <div className="grid sm:grid-cols-3 gap-4">
                      <Fld label="Кадастровый номер" value={form.objCad} onChange={(v) => upd({ objCad: v })} ph="38:36:000012:11359" />
                      <Fld label="Площадь, м²" type="number" value={form.area} onChange={(v) => upd({ area: v })} />
                      <Fld label="Ставка за 1 м², ₽" type="number" value={form.rateManual}
                        onChange={(v) => upd({ rateManual: v })}
                        ph={m.area > 0 ? String(Math.round(m.total / m.area)) : "—"}
                        hint="пусто = цена ÷ площадь" />
                    </div>
                    <Fld label="Исходные данные" area rows={3} value={form.sources}
                      onChange={(v) => upd({ sources: v })} hint="каждая строка — отдельный пункт; пусто → «не требуется»" />
                    <Fld label="Описание объекта / состава работ" area rows={3} value={form.objDesc}
                      onChange={(v) => upd({ objDesc: v })}
                      hint="необязательный текст перед этапами в Приложении №1" />
                    <div className="grid sm:grid-cols-3 gap-4 pt-2 border-t border-concrete">
                      <Fld label="Представитель: ФИО" value={form.repName} onChange={(v) => upd({ repName: v })} />
                      <Fld label="Представитель: e-mail" value={form.repEmail} onChange={(v) => upd({ repEmail: v })} />
                      <Fld label="Представитель: телефон" value={form.repPhone} onChange={(v) => upd({ repPhone: v })} />
                    </div>
                  </DocSection>

                  <DocSection title="Этапы работ" note={m.stages.length + " " + plural(m.stages.length, ["этап", "этапа", "этапов"]) + " · " + rub(m.total)}
                    open={open.stages} onToggle={() => toggle("stages")}>
                    <div className="flex flex-wrap gap-2">
                      <button onClick={importKp}
                        className="hair bg-lilac px-4 py-2 text-xs font-medium uppercase tracking-[0.12em] hover:brightness-95">
                        Перенести из КП
                      </button>
                      <button onClick={addStage}
                        className="hair bg-air px-4 py-2 text-xs uppercase tracking-[0.12em] text-black/60 hover:bg-steel">
                        + Этап
                      </button>
                    </div>
                    <div className="grid sm:grid-cols-2 gap-4">
                      <Fld label="Аванс по умолчанию, %" type="number" value={form.advance}
                        onChange={(v) => upd({ advance: Number(v) })} hint="0 = полная постоплата, 100 = полная предоплата" />
                      <Fld label="Срок оплаты, раб. дн." type="number" value={form.payDays}
                        onChange={(v) => upd({ payDays: Number(v) })} />
                    </div>
                    {form.stages.map((s, i) => (
                      <StageRow key={s.id} s={s} i={i} total={form.stages.length} advance={form.advance}
                        onChange={(patch) => updStage(s.id, patch)}
                        onDrop={() => dropStage(s.id)}
                        onMove={(d) => moveStage(i, d)} />
                    ))}
                  </DocSection>

                  <DocSection title="Условия и приложения" note="неразглашение, НДС, сроки, суд"
                    open={open.extra} onToggle={() => toggle("extra")}>
                    <Chk label="Условие о неразглашении" checked={form.nda} onChange={(v) => upd({ nda: v })}
                      note="в п. 7.5 и 7.6 добавляется отсрочка публикации материалов (формат «ФОРТУНА»)" />
                    {form.nda ? (
                      <Fld label="Отсрочка публикации, лет" type="number" value={form.ndaYears}
                        onChange={(v) => upd({ ndaYears: Number(v) || 0 })} />
                    ) : null}
                    <Chk label="Приложение №2 — налоговые заверения и НДС" checked={form.app2}
                      onChange={(v) => upd({ app2: v })}
                      note="соглашение об условиях применения НДС (ст. 431.2 ГК РФ)" />
                    {form.disc === "int" ? (
                      <Chk label="Указывать формулу расчёта цены" checked={form.formula}
                        onChange={(v) => upd({ formula: v })}
                        note="«Ставка за 1 м2 х Площадь Объекта» в п. 2.1" />
                    ) : null}
                    <div className="pt-2 border-t border-concrete space-y-4">
                      <div className="flex flex-wrap items-center gap-3">
                        <span className={F_LB}>Срок в ст. 3</span>
                        <Seg options={[["days", "Рабочие дни"], ["dates", "С … по …"]]}
                          value={form.termMode} onChange={(v) => upd({ termMode: v })} />
                      </div>
                      {form.termMode === "dates" ? (
                        <div className="grid sm:grid-cols-2 gap-4">
                          <Fld label="Начало" type="date" value={form.dateFrom} onChange={(v) => upd({ dateFrom: v })} />
                          <Fld label="Окончание" type="date" value={form.dateTo} onChange={(v) => upd({ dateTo: v })} />
                        </div>
                      ) : (
                        <p className="text-[11px] font-light text-black/40">
                          Сумма сроков этапов: {daysNom(m.days)}
                        </p>
                      )}
                      <Fld label="Суд" value={form.court} onChange={(v) => upd({ court: v })} />
                    </div>
                  </DocSection>
                </div>

                {/* Правая панель: итоги и вывод */}
                <div className="lg:sticky lg:top-4 space-y-4">
                  <div className="bg-night text-air p-6 space-y-4">
                    <div>
                      <div className="text-[11px] font-medium uppercase tracking-[0.18em] text-white/40">Общая стоимость</div>
                      <div className="mt-1 text-3xl font-normal">{rub(m.total)}</div>
                      {m.nds ? (
                        <div className="mt-1 text-xs font-light text-white/50">
                          в том числе НДС 5% — {mon2(ndsOf(m.total))} ₽
                        </div>
                      ) : null}
                    </div>
                    <div className="grid grid-cols-2 gap-3 text-xs font-light">
                      <div className="border-t border-white/15 pt-2">
                        <div className="text-white/40">Срок</div>
                        <div className="text-sm">{m.days} раб. дн.</div>
                      </div>
                      <div className="border-t border-white/15 pt-2">
                        <div className="text-white/40">Ставка</div>
                        <div className="text-sm">{m.rate > 0 ? mon0(m.rate) + " ₽/м²" : "—"}</div>
                      </div>
                    </div>
                    <div className="text-xs font-light text-white/50 border-t border-white/15 pt-3">
                      {DOC_DISC[form.disc].label}
                      {form.nda ? " · неразглашение" : ""}
                      {form.app2 ? " · Прил. №2" : ""}
                    </div>

                    <button onClick={doWord} disabled={busy}
                      className="w-full bg-sun text-night font-medium py-3 hover:brightness-95 transition disabled:opacity-50">
                      {busy ? "Формируем…" : "Скачать Word (.docx)"}
                    </button>
                    <button onClick={() => window.print()}
                      className="w-full bg-lilac text-night font-medium py-3 hover:brightness-95 transition">
                      Сформировать PDF
                    </button>
                    <p className="text-[11px] font-light text-white/40">
                      PDF — через диалог печати браузера: «Принтер → Сохранить как PDF», поля не менять.
                    </p>
                  </div>

                  {problems.length ? (
                    <div className="hair bg-air p-4">
                      <div className="text-[11px] font-medium uppercase tracking-[0.18em] text-black/40">Не заполнено</div>
                      <ul className="mt-2 space-y-1 text-xs font-light text-black/60">
                        {problems.map((p, i) => <li key={i}>— {p}</li>)}
                      </ul>
                    </div>
                  ) : null}

                  <div className="hair bg-air p-4 space-y-3">
                    <div className="text-[11px] font-medium uppercase tracking-[0.18em] text-black/40">Данные и синхронизация</div>

                    <div className="flex items-start gap-2">
                      <span className={"mt-1 shrink-0 w-2 h-2 " + (SYNC_DOT[sync.state] || "bg-concrete")} />
                      <span className="text-[11px] font-light text-black/60">{syncText}</span>
                    </div>

                    {!SRV_SELF ? (
                      <label className="block">
                        <span className={F_LB}>Адрес сервера данных</span>
                        <input value={srvUrl} placeholder={SRV_DEFAULT} className={F_IN}
                          onChange={(e) => { setSrvUrl(e.target.value); srvSaveUrl(e.target.value); }} />
                        <span className="mt-1 block text-[11px] font-light text-black/40">
                          компьютер-хранилище: запустите на нём data-server.cmd
                        </span>
                      </label>
                    ) : null}

                    <button onClick={() => pushDirs(execs, clients, true)}
                      className="w-full hair bg-air px-3 py-2 text-xs uppercase tracking-[0.12em] text-black/60 hover:bg-steel">
                      Синхронизировать
                    </button>

                    <p className="text-[11px] font-light text-black/45">
                      {STORAGE_OK
                        ? "Копия справочников и черновик лежат в этом браузере — договор готовится и без сети."
                        : "Браузер запретил локальное хранилище — работают только сервер и кнопка «Экспорт»."}
                    </p>
                    <div className="flex gap-2">
                      <button onClick={exportJson}
                        className="flex-1 hair bg-air px-3 py-2 text-xs uppercase tracking-[0.12em] text-black/60 hover:bg-steel">
                        Экспорт
                      </button>
                      <button onClick={() => fileRef.current && fileRef.current.click()}
                        className="flex-1 hair bg-air px-3 py-2 text-xs uppercase tracking-[0.12em] text-black/60 hover:bg-steel">
                        Импорт
                      </button>
                      <input ref={fileRef} type="file" accept=".json,application/json" className="hidden"
                        onChange={(e) => { if (e.target.files && e.target.files[0]) importJson(e.target.files[0]); e.target.value = ""; }} />
                    </div>
                  </div>

                  {msg ? (
                    <div className="hair bg-sun/40 p-3 text-xs font-light">
                      {msg}
                      <button onClick={() => setMsg("")} className="ml-2 text-black/40 hover:text-ink">✕</button>
                    </div>
                  ) : null}
                </div>
              </div>
            </main>
          </div>

          {/* Документ: и предпросмотр на экране, и печатный макет */}
          <div className="pb-24">
            <div className="no-print max-w-6xl mx-auto px-6 pb-3 text-[11px] font-medium uppercase tracking-[0.18em] text-black/40">
              Предпросмотр документа
            </div>
            <DocSheet blocks={blocks} />
          </div>
        </div>
      );
    }

    /* ── Вкладки ──────────────────────────────────────────────────────────── */
    function Root() {
      const [tab, setTab] = useState("kp");
      const kpSnap = useRef(null);
      const TABS = [["kp", "Коммерческое предложение"], ["doc", "Договор"]];
      return (
        <div className="min-h-screen">
          <div className="no-print bg-steel border-b border-concrete">
            <div className="max-w-6xl mx-auto px-6 flex items-stretch">
              {TABS.map(([k, l]) => (
                <button key={k} onClick={() => setTab(k)}
                  className={"px-5 py-3 text-[11px] font-medium uppercase tracking-[0.18em] border-b-2 transition " +
                    (tab === k ? "border-night text-ink bg-air" : "border-transparent text-black/35 hover:text-black/60")}>
                  {l}
                </button>
              ))}
            </div>
          </div>
          {/* Обе вкладки смонтированы: состояние не теряется, а скрытая ветка
              не попадает в печать (display:none выключает и печать) */}
          <div style={{ display: tab === "kp" ? "block" : "none" }}><App snapRef={kpSnap} /></div>
          <div style={{ display: tab === "doc" ? "block" : "none" }}><ContractTool kpSnap={kpSnap} /></div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
  </script>
</body>
</html>
